services:
  db:
    image: mysql:8.0
    container_name: school_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-school}
      MYSQL_USER: ${DB_USERNAME:-school_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-school_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - school_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: school_app
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/storage/app/public
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - school_net

volumes:
  db_data:
    external: true
    name: gspb-website-kcak6r_db_data

  storage_data:

networks:
  school_net:
    driver: bridge
